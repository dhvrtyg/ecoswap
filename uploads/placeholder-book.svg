<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      @keyframes sparkle {
        0%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
        50% { transform: scale(1) rotate(180deg); opacity: 1; }
      }
      .sparkle-star {
        animation: sparkle 3s ease-in-out infinite;
        fill: #4f772d;
      }
      .star-1 { animation-delay: 0s; transform-origin: 30px 22px; }
      .star-2 { animation-delay: 1.5s; transform-origin: 70px 25px; }
    </style>
  </defs>
  <rect width="100" height="100" fill="#f4f7f5" rx="12"/>
  
  <!-- Sparkles -->
  <path class="sparkle-star star-1" d="M30,17 L31.5,20.5 L35,22 L31.5,23.5 L30,27 L28.5,23.5 L25,22 L28.5,20.5 Z"/>
  <path class="sparkle-star star-2" d="M70,20 L71,22.5 L73.5,23.5 L71,24.5 L70,27 L69,24.5 L66.5,23.5 L69,22.5 Z"/>

  <path d="M25,65 C35,62 48,65 50,68 C52,65 65,62 75,65 L75,32 C65,29 52,32 50,35 C48,32 35,29 25,32 Z" fill="#ffffff" stroke="#3a5a40" stroke-width="3" stroke-linejoin="round"/>
  <path d="M50,35 L50,68" stroke="#3a5a40" stroke-width="3" stroke-linecap="round"/>
  <path d="M25,68 C35,65 48,68 50,71 C52,68 65,65 75,68" fill="none" stroke="#7d9d8d" stroke-width="2" stroke-linecap="round"/>
  <path d="M30,40 L45,37" stroke="#7d9d8d" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M30,47 L45,44" stroke="#7d9d8d" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M30,54 L45,51" stroke="#7d9d8d" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M55,37 L70,40" stroke="#7d9d8d" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M55,44 L70,47" stroke="#7d9d8d" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M55,51 L70,54" stroke="#7d9d8d" stroke-width="1.5" stroke-linecap="round"/>
</svg>

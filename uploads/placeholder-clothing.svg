<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      @keyframes swing {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(3deg); }
      }
      .hanger-group {
        animation: swing 4s ease-in-out infinite;
        transform-origin: 50px 18px;
      }
    </style>
  </defs>
  <rect width="100" height="100" fill="#f4f7f5" rx="12"/>
  
  <g class="hanger-group">
    <!-- Hanger hook -->
    <path d="M50,18 C50,14 47,14 47,17 C47,20 50,22 50,25 L50,28" fill="none" stroke="#3a5a40" stroke-width="2.5" stroke-linecap="round"/>
    <!-- T-shirt outline -->
    <path d="M35,30 L42,30 C45,35 55,35 58,30 L65,30 L78,40 L70,48 L65,45 L65,75 C65,78 61,80 58,80 L42,80 C39,80 35,78 35,75 L35,45 L30,48 L22,40 Z" fill="#ffffff" stroke="#3a5a40" stroke-width="3" stroke-linejoin="round"/>
    <!-- Pocket -->
    <path d="M53,45 L60,45 L60,53 C60,56 57,58 53,58 Z" fill="none" stroke="#7d9d8d" stroke-width="2"/>
  </g>
</svg>
